<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Main Red Gradient adapted to #d4242c -->
    <linearGradient id="bodyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8333b" />
      <stop offset="100%" stop-color="#b01c24" />
    </linearGradient>

    <!-- Scale Pattern adapted to #d4242c -->
    <pattern id="scales" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Red scale base with gold strokes -->
      <path d="M 0,30 Q 30,0 60,30 Q 30,60 0,30 Z" fill="#c91f28" stroke="#ffb347" stroke-width="1.5"/>
      <path d="M 30,0 Q 60,-30 90,0 Q 60,30 30,0 Z" fill="#c91f28" stroke="#e5e1dc" stroke-width="1.5"/>
      <path d="M 30,60 Q 60,30 90,60 Q 60,90 30,60 Z" fill="#c91f28" stroke="#ffb347" stroke-width="1.5"/>
      <path d="M -30,0 Q 0,-30 30,0 Q 0,30 -30,0 Z" fill="#c91f28" stroke="#e8e6e3" stroke-width="1.5"/>
      <path d="M -30,60 Q 0,30 30,60 Q 0,90 -30,60 Z" fill="#c91f28" stroke="#ffb347" stroke-width="1.5"/>
      <!-- Highlight adapted -->
      <path d="M 6,30 Q 30,8 54,30" fill="none" stroke="#f04a52" stroke-width="2.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- === SINGLE BODY SECTION (SQUARE) === -->
  <g id="body-section">
    <!-- Main Torso Segment as a Square -->
    <rect x="60" y="60" width="180" height="180" rx="15" ry="15" fill="url(#bodyRed)" />
          
    <!-- Overlay Scale Pattern -->
    <rect x="60" y="60" width="180" height="180" rx="15" ry="15" fill="url(#scales)" opacity="0.85" />
  </g>
</svg>